[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyHydroGeophysiX_Carl"
version = "0.1.0"
description = "Coupled hydrogeophysical modeling framework for Carlone field site"
authors = [{name = "Luigi Martinoisio"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "pygimli>=1.3",
    "flopy>=3.3",
    "matplotlib>=3.4",
    "pyarrow>=8.0",
    "jupyter>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
    "sphinx>=4.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=html"